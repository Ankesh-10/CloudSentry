<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23111111'/><path d='M16 7 9 10v5.5c0 4.4 3 8.2 7 9.5 4-1.3 7-5.1 7-9.5V10z' fill='%23ffffff'/></svg>" />
    <title>CloudSentry</title>
    <script>
      // Apply the saved theme before first paint (no light/dark flash).
      try {
        var t = localStorage.getItem('cloudsentry-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
