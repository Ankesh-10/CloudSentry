# Local development only: hot reload and source mounts. Production uses the
# image built from backend/Dockerfile without these overrides.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./data:/app/data
      - ./db:/app/db
      - ./models:/app/models
    env_file:
      - .env
    environment:
      EXPOSE_API_DOCS: "true"
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Vite proxies /api to the backend container; reads frontend/.env.local for Supabase.
      VITE_DEV_API_PROXY: http://backend:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
