name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6"
      - name: Ruff (syntax errors, undefined names)
        run: ruff check .

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dependency audit (pip-audit)
        run: |
          pip install "pip-audit>=2.7"
          pip-audit -r backend/requirements.txt --strict

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Tests (incl. integration) with coverage
        # tests/conftest.py forces safe test settings; no secrets are needed.
        run: >
          pytest -ra
          --cov=backend --cov=ml --cov-report=term-missing:skip-covered
          --cov-fail-under=70
      - name: ML evaluation targets
        run: python -m ml.evaluation --strict

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # The frontend is not in the repository yet: skip (green) until
      # frontend/package-lock.json is committed, then every step runs.
      - name: Is the frontend committed?
        id: present
        working-directory: .
        run: |
          if [ -f frontend/package-lock.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "::notice::frontend/ not committed; frontend checks skipped"; fi
      - uses: actions/setup-node@v4
        if: steps.present.outputs.yes == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.present.outputs.yes == 'true'
        run: npm ci
      - name: Type check
        if: steps.present.outputs.yes == 'true'
        run: npm run typecheck
      - name: Tests
        if: steps.present.outputs.yes == 'true'
        run: npm test
      - name: Build
        if: steps.present.outputs.yes == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - name: Dependency audit
        if: steps.present.outputs.yes == 'true'
        run: npm audit --omit=dev --audit-level=high

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "asyncpg>=0.29"
      - name: Create the Supabase roles the migrations grant to
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
      - name: Apply all migrations on an empty database
        run: python scripts/apply_migrations.py
      - name: Re-run is a no-op
        run: python scripts/apply_migrations.py
      - name: Append-only audit log is enforced
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO audit_logs (event_type, actor) VALUES ('ci_probe', 'SYSTEM');"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE audit_logs SET actor = 'x';"; then
            echo "audit_logs UPDATE was allowed"; exit 1
          fi
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM audit_logs;"; then
            echo "recent audit_logs DELETE was allowed"; exit 1
          fi
      - name: Vocabulary constraints are enforced
        run: |
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO optimization_actions (action_type, status) VALUES ('terminate_ec2', 'pending');"; then
            echo "unknown action_type was accepted"; exit 1
          fi
      - name: Health's stale-resource query runs on the real schema
        run: |
          python - <<'EOF'
          import asyncio, os, re
          import asyncpg
          src = open("backend/app/services/health.py", encoding="utf-8").read()
          sql = re.search(r'_STALE_RESOURCES_SQL = """(.*?)"""', src, re.S).group(1)
          async def main():
              conn = await asyncpg.connect(os.environ["DATABASE_URL"])
              old = "NOW() - interval '2 hours'"
              await conn.execute(
                  "INSERT INTO resources (provider_id, resource_type, region, state, first_seen) VALUES "
                  f"('i-ci-silent', 'ec2', 'us-east-1', 'running', {old}), "
                  f"('i-ci-busy', 'ec2', 'us-east-1', 'running', {old}), "
                  f"('fn-ci', 'lambda', 'us-east-1', 'available', {old})")
              await conn.execute(
                  "INSERT INTO resource_metrics (time, resource_id, metric_name, value) "
                  "SELECT NOW(), id, 'CPUUtilization', 1 FROM resources WHERE provider_id = 'i-ci-busy'")
              rows = await conn.fetch(sql, 30)
              assert [r["name"] for r in rows] == ["i-ci-silent"], rows
              await conn.close()
          asyncio.run(main())
          EOF

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f backend/Dockerfile -t cloudsentry-backend:ci .
      - name: Image runs as non-root and has the migration runner
        run: |
          test "$(docker run --rm --entrypoint id cloudsentry-backend:ci -u)" != "0"
          docker run --rm --entrypoint python cloudsentry-backend:ci scripts/apply_migrations.py --help
