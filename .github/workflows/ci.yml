name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6"
      - name: Ruff (syntax errors, undefined names)
        run: ruff check .

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dependency audit (pip-audit)
        run: |
          pip install "pip-audit>=2.7"
          # GHSA-wj6h-64fc-37mp / CVE-2024-23342: Minerva timing side channel in
          # `ecdsa` (pulled in by python-jose), no fixed release exists. Not
          # exploitable here: python-jose[cryptography] verifies ES256 with the
          # `cryptography` backend, and this service never signs with ECDSA.
          pip-audit -r backend/requirements.txt --strict --ignore-vuln GHSA-wj6h-64fc-37mp

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Tests (incl. integration) with coverage
        # tests/conftest.py forces safe test settings; no secrets are needed.
        run: >
          pytest -ra
          --cov=backend --cov=ml --cov-report=term-missing:skip-covered
          --cov-fail-under=70
      - name: ML evaluation targets
        run: python -m ml.evaluation --strict

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "asyncpg>=0.29"
      - name: Create the Supabase roles the migrations grant to
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
      - name: Apply all migrations on an empty database
        run: python scripts/apply_migrations.py
      - name: Re-run is a no-op
        run: python scripts/apply_migrations.py
      - name: Append-only audit log is enforced
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO audit_logs (event_type, actor) VALUES ('ci_probe', 'SYSTEM');"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE audit_logs SET actor = 'x';"; then
            echo "audit_logs UPDATE was allowed"; exit 1
          fi
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM audit_logs;"; then
            echo "recent audit_logs DELETE was allowed"; exit 1
          fi
      - name: Vocabulary constraints are enforced
        run: |
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO optimization_actions (action_type, status) VALUES ('terminate_ec2', 'pending');"; then
            echo "unknown action_type was accepted"; exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f backend/Dockerfile -t cloudsentry-backend:ci .
      - name: Image runs as non-root and has the migration runner
        run: |
          test "$(docker run --rm --entrypoint id cloudsentry-backend:ci -u)" != "0"
          docker run --rm --entrypoint python cloudsentry-backend:ci scripts/apply_migrations.py --help
